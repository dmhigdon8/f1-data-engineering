version: 2

models:
  - name: dim_driver
    description: "One row per driver."
    columns:
      - name: driver_id
        tests: [unique, not_null]
      - name: full_name
        tests: [not_null]

  - name: dim_race
    description: "One row per race (season + round)."
    columns:
      - name: race_key
        tests: [unique, not_null]
      - name: season
        tests: [not_null]
      - name: round_num
        tests: [not_null]

  - name: fct_race_results
    description: "One row per driver per race."
    columns:
      - name: result_key
        tests: [unique, not_null]
      - name: race_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_race')
              field: race_key
      - name: driver_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_driver')
              field: driver_id
      - name: points
        tests:
          - not_null

  - name: fct_sprint_results
    description: "One row per driver per sprint race (2021+ only)."
    columns:
      - name: result_key
        tests: [unique, not_null]
      - name: race_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_race')
              field: race_key
      - name: driver_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_driver')
              field: driver_id
      - name: points
        tests:
          - not_null
